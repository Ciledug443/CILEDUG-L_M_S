<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ·KO Academy - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-bold text-red-700 mb-2">AZ·KO Academy</h1>
            <p class="text-gray-600">Product Knowledge Learning Management System</p>
        </div>

        <div class="bg-white rounded-2xl shadow-xl p-8">
            <h2 class="text-2xl font-bold text-gray-900 mb-6 text-center">Masuk ke Akun Anda</h2>
            
            <form id="loginForm" class="space-y-5" onsubmit="handleLogin(event)">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input id="emailInput" type="email" required 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500" 
                        placeholder="nama@perusahaan.com">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input id="passwordInput" type="password" required 
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-red-500" 
                        placeholder="••••••••">
                </div>

                <div id="errorMsg" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm"></div>

                <button type="submit" id="loginBtn" 
                    class="w-full bg-red-700 hover:bg-red-800 text-white py-3 px-4 rounded-lg font-semibold transition-all">
                    Masuk ke Dashboard
                </button>
            </form>

            <div class="mt-6 pt-6 border-t border-gray-200">
                <p class="text-xs text-gray-500 text-center mb-3">Akun Demo:</p>
                <div class="space-y-2 text-xs">
                    <div class="p-2 bg-gray-50 rounded"><b>Karyawan:</b> karyawan@azko.com / password123</div>
                    <div class="p-2 bg-gray-50 rounded"><b>Manager:</b> manager@azko.com / password123</div>
                    <div class="p-2 bg-gray-50 rounded"><b>Admin:</b> admin@azko.com / password123</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // KONFIGURASI SUPABASE (HANYA 1x DEKLARASI)
        // ==========================================
        const SUPABASE_URL = 'https://pclcvnkzzmczdsfmfenx.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjbGN2bmt6em1jemRzZm1mZW54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwNzg1NzIsImV4cCI6MjEwMzY1NDU3Mn0.HvpfwjvrfohkQz21GdnYSgC7Qkatv_ILKE_OlioDlus';
        
        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ==========================================
        // HANDLE LOGIN
        // ==========================================
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('emailInput').value;
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('errorMsg');
            const btn = document.getElementById('loginBtn');
            
            errorDiv.classList.add('hidden');
            btn.disabled = true;
            btn.textContent = 'Memproses...';
            
            try {
                const { data, error } = await sb.auth.signInWithPassword({ 
                    email: email, 
                    password: password 
                });
                
                if (error) throw error;
                
                // Ambil data profile
                const { data: profile, error: profileError } = await sb
                    .from('profiles')
                    .select('*')
                    .eq('id', data.user.id)
                    .single();
                
                if (profileError) throw profileError;
                
                // Simpan session
                localStorage.setItem('currentUser', JSON.stringify(profile));
                localStorage.setItem('isAuthenticated', 'true');
                
                // Redirect ke dashboard
                window.location.href = 'dashboard.html';
                
            } catch (error) {
                console.error('Login error:', error);
                errorDiv.textContent = '❌ ' + (error.message || 'Login gagal');
                errorDiv.classList.remove('hidden');
                btn.disabled = false;
                btn.textContent = 'Masuk ke Dashboard';
            }
        }

        // Cek session saat load
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (session) {
                window.location.href = 'dashboard.html';
            }
        });
    </script>
</body>
</html>
