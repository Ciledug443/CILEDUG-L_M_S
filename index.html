<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AZ·KO Academy</title>
    <!-- Tailwind CSS untuk styling cepat -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }
        .nav-active { color: #b91c1c; border-bottom: 2px solid #b91c1c; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="bg-white shadow-sm border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-2xl font-bold text-red-700">AZ·KO Academy</span>
                </div>
                <div class="flex space-x-8 items-center">
                    <a href="#" class="nav-active px-3 py-2 text-sm font-medium flex items-center gap-2">
                         Home
                    </a>
                    <a href="#" class="text-gray-500 hover:text-gray-700 px-3 py-2 text-sm font-medium flex items-center gap-2">
                        📚 Catalog
                    </a>
                    <a href="#" class="text-gray-500 hover:text-gray-700 px-3 py-2 text-sm font-medium flex items-center gap-2">
                        🏆 Leaderboard
                    </a>
                </div>
                <div class="flex items-center gap-4">
                    <div class="text-right hidden sm:block">
                        <div class="text-sm font-bold text-gray-900">Manager Ciledug</div>
                        <div class="text-xs text-gray-500">Lv.3 Senior Expert</div>
                    </div>
                    <div class="bg-red-50 px-3 py-1 rounded-full border border-red-100">
                        <span class="font-bold text-red-700 text-sm">1000</span> <span class="text-xs text-red-600">Poin</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Status Bar -->
        <div class="mb-6 flex items-center gap-2 text-sm text-green-600 bg-green-50 p-3 rounded-lg border border-green-200">
            <span class="w-2 h-2 rounded-full bg-green-500 animate-pulse"></span>
            Connected to Supabase
        </div>

        <!-- Section Title -->
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Katalog Modul Produk</h2>

        <!-- Modules Grid -->
        <div id="modulesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Loading State -->
            <div class="col-span-full text-center py-12 text-gray-500">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-red-700 mb-2"></div>
                <p>Memuat modul dari Supabase...</p>
            </div>
        </div>

    </main>

    <!-- JAVASCRIPT LOGIC -->
    <script>
    // ==========================================
    // KONFIGURASI SUPABASE (HANYA SEKALI)
    // ==========================================
    const SUPABASE_URL = 'https://pclcvnkzzmczdsfmfenx.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjbGN2bmt6em1jemRzZm1mZW54Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzgwNTY4NzMsImV4cCI6MjA1MzYzMjg3M30.Jz8KqJvKzP8VqJvKzP8VqJvKzP8VqJvKzP8VqJvKzP8'; // GANTI dengan key Anda
    
    // Inisialisasi client (HANYA SEKALI)
    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ==========================================
    // FUNGSI LOAD MODUL
    // ==========================================
    async function loadModules() {
        const grid = document.getElementById('modulesGrid');
        
        try {
            const { data, error } = await supabaseClient
                .from('products')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) throw error;

            if (!data || data.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-white rounded-lg shadow">
                        <p class="text-gray-500">Belum ada modul. Tambahkan data di Supabase Table Editor.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = data.map(product => `
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden hover:shadow-md transition-shadow">
                    <img src="${product.image_url || 'https://via.placeholder.com/400x200?text=No+Image'}" 
                         class="w-full h-48 object-cover">
                    <div class="p-5">
                        <div class="text-xs font-mono text-gray-500 mb-1">SKU: ${product.sku || '-'}</div>
                        <h3 class="text-lg font-bold text-gray-900 mb-2">${product.title}</h3>
                        <p class="text-sm text-gray-600 mb-4">${product.description || ''}</p>
                        <div class="flex justify-between items-center">
                            <span class="px-2 py-1 text-xs font-semibold rounded-full ${
                                product.category === 'Mandatory' ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'
                            }">${product.category || 'General'}</span>
                            <button onclick="startQuiz('${product.id}')" 
                                    class="bg-red-700 hover:bg-red-800 text-white px-4 py-2 rounded-lg text-sm font-semibold">
                                Mulai Posttest
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

        } catch (error) {
            console.error('Error:', error);
            grid.innerHTML = `
                <div class="col-span-full text-center py-12 bg-red-50 rounded-lg border border-red-200">
                    <p class="text-red-600 font-semibold">Error: ${error.message}</p>
                </div>`;
        }
    }

    function startQuiz(productId) {
        alert('Fitur quiz akan segera hadir! Product ID: ' + productId);
    }

    document.addEventListener('DOMContentLoaded', loadModules);
</script>
</body>
</html>
